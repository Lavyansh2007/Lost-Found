<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Lost</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>

<body>

<header>
  <h1>
<i class="fa-solid fa-magnifying-glass-location"></i>
Lost & Found Portal
</h1>
  <nav>
    <a href="index.html">
    <i class="fa-solid fa-house"></i> Home
</a>

   <a href="report.html" class="active">
    <i class="fa-solid fa-circle-plus"></i> Report Lost
</a>

  <a href="lostitems.html">
    <i class="fa-solid fa-box-open"></i>Lost Items
</a>
   <a href="contact.html">
      <i class="fa-solid fa-phone"></i>Contact
  </a>
  <a href="about.html">
    <i class="fa-solid fa-circle-info"></i>About
  </a>
  </nav>
</header>

<div class="container">
<div class="card">
<h3>Report Lost Item</h3>

<form id="reportForm" action="/report" method="POST" enctype="multipart/form-data">
  <label>
    <i class="fa-solid fa-box"></i>
    Item Name
</label>
  <input
    type="text"
    id="item"
    name="item"
    placeholder="Enter item name"
    required>

 <label>
    <i class="fa-solid fa-file-lines"></i>
    Description
</label>
  <textarea
    id="desc"
    name="description"
    placeholder="Describe the lost item..."
    required></textarea>
 <label>
    <i class="fa-solid fa-envelope"></i>
    Email
</label>
  <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email"
    required>
    <label>
    <i class="fa-solid fa-lock"></i>
    Create Password
</label>

<input
    type="password"
    id="reportPassword"
    name="reportPassword"
    placeholder="Create a password"
    minlength="6"
    required>
<label>
  <i class="fa-solid fa-image"></i>
  Upload Image
</label>

  <input
    type="file"
    id="image"
    name="image"
    accept="image/*">
  <button type="button" onclick="verifyEmail()">
    <i class="fa-solid fa-paper-plane"></i>
    Verify & Submit
</button>
</form>

</div>
</div>
<div id="otpSection">
  <p>
    Enter the 6-digit OTP sent to your email.
  </p>

  <input
    type="text"
    id="otpInput"
    placeholder="Enter OTP"
    maxlength="6"
    inputmode="numeric">

  <button type="button" onclick="verifyOTP()">
    <i class="fa-solid fa-shield-halved"></i>
    Verify OTP
  </button>
</div>
<footer>Lost & Found Management System</footer>
</body>
</html>
